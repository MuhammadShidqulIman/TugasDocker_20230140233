<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Input Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-sm border-0 w-100" style="max-width: 500px;">
        <div class="card-header bg-success text-white py-3">
            <h5 class="mb-0 fw-bold">Form Input Mahasiswa</h5>
        </div>
        <div class="card-body p-4">
            <form action="/submit" method="post" th:object="${user}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nama Lengkap</label>
                    <input type="text" th:field="*{nama}" class="form-control" placeholder="Masukkan nama" required />
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nomor Induk Mahasiswa (NIM)</label>
                    <input type="text" th:field="*{nim}" class="form-control" placeholder="Masukkan NIM" required />
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Jenis Kelamin</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" th:field="*{jenisKelamin}" value="Laki-laki" required id="lk">
                        <label class="form-check-label" for="lk">Laki-laki</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" th:field="*{jenisKelamin}" value="Perempuan" required id="pr">
                        <label class="form-check-label" for="pr">Perempuan</label>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-bold">Simpan Data</button>
                    <a href="/home" class="btn btn-outline-secondary fw-semibold">Kembali ke Home</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
