<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: white; }

        /* Tambahan style untuk mengatur ukuran dan posisi gambar */
        .login-logo {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%; /* Membuat gambar menjadi bulat, hapus jika ingin kotak */
            margin: 0 auto 20px auto;
            display: block;
        }
    </style>
</head>
<body>
<div class="login-card">

    <img th:src="@{/images/logo.png}" alt="Logo Sistem" class="login-logo"
         onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">

    <h3 class="text-center mb-4 fw-bold">Login Sistem</h3>

    <div th:if="${error}" class="alert alert-danger py-2" role="alert" th:text="${error}"></div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required placeholder="Masukkan username" />
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Masukkan NIM" />
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
    </form>
</div>
</body>
</html>
