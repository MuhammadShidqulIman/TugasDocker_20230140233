<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h4 class="mb-0 fw-bold">MY Website - 20200140233</h4>
            <a href="/" class="btn btn-danger btn-sm fw-semibold">Logout</a>
        </div>
        <div class="card-body p-4">
            <h5 class="card-title fw-semibold">Selamat datang di aplikasi!</h5>
            <p class="card-text text-muted">Berikut adalah daftar data mahasiswa yang telah diinput.</p>

            <a href="/form" class="btn btn-success mb-3 fw-semibold">
                + Input Data Mahasiswa
            </a>

            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover text-center align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Jenis Kelamin</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user, stat : ${users}">
                        <td th:text="${stat.count}"></td>
                        <td th:text="${user.nama}"></td>
                        <td th:text="${user.nim}"></td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${user.jenisKelamin}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="4" class="text-muted fst-italic py-3">Belum ada data mahasiswa</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
